name: Daily portfolio radar

on:
  schedule:
    # 11:23 UTC = 3:23am Pacific (PST) / 4:23am (PDT)
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: write # only to commit reports/ and data/ back to this repo

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    # The public template has no owners or secrets, so it never runs there. Your private copy runs daily.
    if: github.repository != 'agentic-incubator/portfolio-radar-template'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Build report
        # The script signs in as the GitHub App and mints a read-only token for every owner
        # it's installed on. Adding an owner needs no change here: see docs/setup.md.
        env:
          RADAR_APP_ID: ${{ secrets.RADAR_APP_ID }}
          RADAR_APP_PRIVATE_KEY: ${{ secrets.RADAR_APP_PRIVATE_KEY }}
        run: node scripts/radar.mjs

      - name: Commit report
        run: |
          git config user.name "portfolio-radar"
          git config user.email "portfolio-radar@users.noreply.github.com"
          git add reports data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(report): daily radar $(date -u +%F)"
            git push
          fi
