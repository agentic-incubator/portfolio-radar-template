name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["reports/**", "data/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: node --check scripts/radar.mjs
      - run: node --test test/*.test.mjs
